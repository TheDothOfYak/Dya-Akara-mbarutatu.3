<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a10">
  <title>Skaar Uverkhron — Flake Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23120c24'/><circle cx='50' cy='50' r='30' fill='none' stroke='%238e7cff' stroke-width='8'/><circle cx='50' cy='50' r='9' fill='%23ffe3a3'/></svg>">
  <link rel="stylesheet" href="css/su.css">
  <script>window.DYA_APP = 'su';</script>
</head>
<body>
  <!-- the adventure map: the map takes the whole width; everything you need sits in the bar along the bottom -->
  <div id="game" class="hidden">
    <div id="topbar"></div>
    <div id="mapwrap"><canvas id="map"></canvas><div id="maphint"></div></div>
    <div id="status">Welcome to the Mbaru Tatu.</div>
    <div id="side">
      <div class="bb-mini">
        <canvas id="mini" width="200" height="124" title="Click to look there"></canvas>
        <div id="layers"></div>
      </div>
      <div class="bb-roster">
        <div class="lhead"><span>Heroes <span id="herocount"></span></span></div>
        <div id="roster"><div class="rcol" id="herolist"></div><div class="lhead"><span>Towns &amp; keeps</span></div><div class="rcol" id="townlist"></div></div>
      </div>
      <div id="selinfo" class="panel"></div>
      <div id="sidebtns">
        <button class="btn" id="b-next" title="Next army (N)">Next</button>
        <button class="btn" id="b-sleep" title="Leave this army until you wake it (Z)">Sleep</button>
        <button class="btn" id="b-songs" title="Map songs (Q)">Songs</button>
        <button class="btn" id="b-hero" title="Hero (H)">Hero</button>
        <button class="btn" id="b-kingdom" title="Your kingdom and your territories (K)">Kingdom</button>
        <button class="btn mapbtn" id="b-map" title="Pull out the map: every world, your territories, your caravans and the storm (M)">Map</button>
        <button class="btn" id="b-post" title="Raise a watch post where the picked army stands: it guards your caravans through this territory (B)">Post</button>
        <button class="btn" id="b-way" title="Show where the picked army can go today, and what blocks it (G)">Way</button>
        <button class="btn" id="b-key" title="What the words and marks mean (?)">Key</button>
        <button class="btn" id="b-menu" title="Menu (Esc)">Menu</button>
        <button class="btn primary big" id="endturn" title="End your turn (E)">End Turn</button>
      </div>
    </div>
  </div>

  <div id="town" class="screen hidden"></div>
  <div id="battle" class="screen hidden"></div>
  <div id="title" class="screen"></div>

  <script src="../js/config.js"></script>
  <script src="../js/flake/account.js"></script>
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/make.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/realm.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/art.js"></script>
  <script src="js/art_objects.js"></script>
  <script src="js/view_map.js"></script>
  <script src="js/sketch.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/talk.js"></script>
  <script src="js/view_town.js"></script>
  <script src="js/view_battle.js"></script>
  <script src="js/save.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/online.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pregame.js"></script>
  <script src="js/saveload.js"></script>
  <script src="js/records.js"></script>
  <script src="../js/core/broadcast.js"></script><!-- live messages from the Admin Panel; does nothing when the game is opened on its own -->
</body>
</html>
