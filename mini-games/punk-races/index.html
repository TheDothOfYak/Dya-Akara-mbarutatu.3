<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14100b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flake Games">
  <title>Punk Races — Flake Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='18' fill='%2314100b'/><ellipse cx='50' cy='58' rx='30' ry='24' fill='%23e8842a'/><path d='M48 34q2-12 12-14' stroke='%236a5a2a' stroke-width='6' fill='none'/></svg>">
  <script>window.DYA_APP = 'pr';</script>
  <script src="../../js/flake/mobile.js" data-game="1" data-awake="1"></script>
  <style>
    :root { --bg: #14100b; --card: #221a12; --card2: #2c2218; --line: #4a3a26; --ink: #f2e6cf; --muted: #b8a68a; --gold: #d9b87a; --green: #7fbf5a; --red: #d8604a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    body.racing { overflow: hidden; touch-action: none; }
    canvas#race { position: fixed; inset: 0; display: block; }
    #ui { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(ellipse at top, #3a2a18 0%, #14100b 70%); z-index: 5; }
    .hidden { display: none !important; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 48px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .top h1 { flex: 1; margin: 0; font: 700 26px/1.1 Georgia, 'Times New Roman', serif; color: var(--gold); letter-spacing: .5px; }
    .coins { font-weight: 700; color: var(--gold); white-space: nowrap; }
    .btn { background: var(--card2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font: inherit; cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: var(--gold); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.primary { background: #6a4a1e; border-color: #a07a3a; font-weight: 600; }
    .btn.danger { border-color: #7a3a2a; color: #f0b8a8; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 5px 10px; font-size: 13px; }
    .btn.big { padding: 13px 26px; font-size: 18px; }
    .btn.on { background: #6a4a1e; border-color: var(--gold); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
    .card.hero { display: flex; gap: 16px; align-items: center; }
    .card.punk { display: flex; gap: 14px; align-items: center; }
    .grow { flex: 1; min-width: 0; }
    .pname { font: 700 18px Georgia, serif; color: var(--gold); }
    .muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .right { text-align: right; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .row.center { justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .tile { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--ink); font: inherit; cursor: pointer; }
    .tile:hover { border-color: var(--gold); transform: translateY(-1px); }
    .ti { font-size: 26px; } .tn { font-weight: 700; margin: 4px 0 2px; } .ta { color: var(--muted); font-size: 13px; }
    .stats { margin: 8px 0; display: grid; gap: 4px; max-width: 420px; }
    .stat { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .stat .sn { width: 52px; color: var(--muted); }
    .stat .bar { flex: 1; height: 8px; background: #120d08; border-radius: 4px; overflow: hidden; }
    .stat .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a06a2a, #e8b23a); }
    .stat b { width: 18px; text-align: right; }
    .portrait { flex: none; background: radial-gradient(circle at 50% 70%, #3a4a22, #1a1a10 70%); border-radius: 12px; }
    .list { display: grid; gap: 0; }
    .trackrow { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; color: var(--ink); font: inherit; cursor: pointer; }
    .trackrow:disabled { opacity: .5; cursor: default; }
    .trackrow:hover:not(:disabled) { border-color: var(--gold); }
    .betrow { text-align: left; width: 100%; color: var(--ink); font: inherit; cursor: pointer; }
    .odds { font: 700 20px Georgia, serif; color: var(--gold); white-space: nowrap; }
    .tswatch { width: 54px; height: 54px; border-radius: 10px; flex: none; }
    .tswatch.farm { background: linear-gradient(#7fb8e0, #f4e2b4 60%, #6f8f3c 60%); }
    .tswatch.forest { background: linear-gradient(#6fa6cc, #d6e6c2 60%, #4c6c2c 60%); }
    .tswatch.river { background: linear-gradient(#8cc2e6, #eef4f2 55%, #5aa0d0 55%); }
    .tswatch.mist { background: linear-gradient(#9aa4ae, #dadfe2 60%, #4f5a4a 60%); }
    .tswatch.spires { background: linear-gradient(#5e90d4, #f2d6aa 60%, #6a5a48 60%); }
    .tswatch.ash { background: linear-gradient(#2e2228, #b0603a 60%, #2a2220 60%); }
    .tswatch.jungle { background: linear-gradient(#4f9686, #d6e8a2 60%, #3f5428 60%); }
    .tswatch.fair { background: linear-gradient(#86bef0, #ffe6bc 60%, #c84a3a 60%); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px; }
    .tbl td { padding: 6px; border-bottom: 1px solid #2e2418; }
    .tbl tr.mine td { color: var(--gold); font-weight: 600; }
    .big { font-size: 54px; }
    .prose h3 { color: var(--gold); margin: 14px 0 4px; font-family: Georgia, serif; }
    .prose p { margin: 6px 0; }
    kbd { background: #120d08; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 13px; }
    select { background: var(--card2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font: inherit; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .swatch.on { border-color: #fff; }
    a { color: var(--gold); }
    .txt { background: #120d08; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; max-width: 280px; margin-top: 4px; }
    .txt.code { text-transform: uppercase; letter-spacing: 4px; font-weight: 700; width: 140px; }
    .roomcode { font: 700 54px Georgia, serif; letter-spacing: 10px; color: var(--gold); margin: 6px 0; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2c2218; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 12px; z-index: 30; transition: opacity .5s; }
    .toast.out { opacity: 0; }
    /* the race HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    #hudTop { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: center; gap: 14px; }
    #hudPlace { font: 700 28px Georgia, serif; color: #fff; }
    #hudTime, #hudSpeed { color: #fff; font-size: 16px; }
    #hudTrack { flex: 1; text-align: center; color: rgba(255,255,255,.85); font-size: 14px; }
    #prog { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 46px); left: 16px; right: 16px; height: 6px; background: rgba(0,0,0,.35); border-radius: 3px; }
    #prog i { position: absolute; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
    #boostBar { position: absolute; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 200px; height: 14px; background: rgba(0,0,0,.4); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); }
    #boostFill { height: 100%; width: 0; background: linear-gradient(90deg, #e8a03a, #ffe08a); }
    #boostBar.full { box-shadow: 0 0 12px #ffe08a; }
    #boostLbl { position: absolute; left: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 18px); color: #fff; font-size: 12px; }
    #hudMsg { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font: 700 72px Georgia, serif; color: #fff; }
    #hudTip { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; color: #fff; font-size: 16px; }
    .hbtn { pointer-events: auto; background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    #touch { position: fixed; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 4; }
    #touch { display: flex; gap: 12px; align-items: flex-end; }
    #trickBtn { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.45); color: #fff; font-size: 28px; }
    .pop { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font: 700 34px Georgia, serif; text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: popup 1.1s ease-out forwards; pointer-events: none; white-space: nowrap; }
    .pop.small { font-size: 20px; top: 44%; }
    @keyframes popup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 30% { transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -40px) scale(1); } }
    #draft { position: absolute; left: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 40px); color: #cfefff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    #hud { font-family: system-ui, sans-serif; }
    #hudTop { background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0)); padding: 6px 10px 18px; border-radius: 10px; }
    #boostBar { backdrop-filter: blur(3px); }
    #boostBtn { width: 84px; height: 84px; border-radius: 50%; background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.5); color: #fff; font-size: 34px; }
    #boostBtn.ready { background: rgba(232,160,58,.7); border-color: #ffe08a; box-shadow: 0 0 18px #ffe08a; }
    #pausebox { position: fixed; inset: 0; background: rgba(10,8,6,.7); z-index: 20; display: flex; align-items: center; justify-content: center; }
    #pausebox .card { min-width: 260px; text-align: center; }
    @media (max-width: 560px) {
      .card.hero, .card.punk { flex-direction: column; align-items: flex-start; }
      .top h1 { font-size: 20px; }
      #hudPlace { font-size: 22px; } #hudTrack { display: none; } #boostBar { width: 130px; }
      #hudTip { bottom: 130px; padding: 0 16px; font-size: 14px; } #hudMsg { font-size: 54px; }
    }
  </style>
</head>
<body>
  <canvas id="race"></canvas>
  <div id="hud" class="hidden">
    <div id="hudTop">
      <div id="hudPlace"></div><div id="hudTime"></div><div id="hudSpeed"></div>
      <div id="hudTrack"></div>
      <button class="hbtn hidden" id="skip" type="button">Skip to the finish</button>
      <button class="hbtn" id="pause" type="button">❚❚</button>
    </div>
    <div id="prog"></div>
    <div id="boostLbl">BOOST</div>
    <div id="boostBar"><div id="boostFill"></div></div>
    <div id="hudMsg" class="hidden"></div>
    <div id="hudTip" class="hidden"></div>
    <div id="draft" class="hidden">slipstream</div>
  </div>
  <div id="touch" class="hidden"><button id="trickBtn" type="button">↻</button><button id="boostBtn" type="button">⚡</button></div>
  <div id="pausebox" class="hidden"><div class="card"><h2 style="color:var(--gold);font-family:Georgia,serif">Paused</h2>
    <div class="row center"><button class="btn primary" id="resume" type="button">Carry on</button><button class="btn danger" id="quit" type="button">Leave the race</button></div></div></div>
  <div id="ui"></div>

  <script src="../../js/config.js"></script>
  <script src="../../js/flake/account.js"></script>
  <script src="../../js/core/broadcast.js"></script><!-- live messages from the Admin Panel -->
  <script src="../../js/flake/mini_save.js"></script>
  <script src="../../js/flake/canvas_fx.js"></script>
  <script src="js/pr_data.js"></script>
  <script src="js/pr_sim.js"></script>
  <script src="js/pr_net.js"></script>
  <script src="js/pr_art.js"></script>
  <script src="js/pr_main.js"></script>
</body>
</html>
