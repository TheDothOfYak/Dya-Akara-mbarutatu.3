<title>Lútut Rider sprite renderer</title>
<!--
  Renders the ride's Lútut and Eikar frames from the real 3D models (the Lútut from
  rpg/assets/models/lutut.glb, the Eikar from rpg/js/actors.js), side on and facing right,
  each with a warm ink outline (Tuftwood's), into PNGs plus a JSON of where the body's middle,
  the saddle, the mouth and the tail ball are in each frame.
  Run it with:  node mini-games/lutut-rider/tools/render_sprites.js
-->
<script type="importmap">{ "imports": { "three": "../../../rpg/vendor/three.module.min.js", "three/addons/": "../../../rpg/vendor/addons/" } }</script>
<style>body { margin: 0; background: #888; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { loadLutut, buildLututActor } from '../../../rpg/js/lutut3d.js';
import { buildEikar, poseArm } from '../../../rpg/js/actors.js';

const PPM = 48;            // sprite pixels to the metre
const YAW = -0.32;          // turned a little toward you, so both wings read
const INK = '#3a2a22', OUTLINE = 2.6;

const W = 900, H = 700;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.6;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
/* light as in Torcain's Run's open regions, plus a cool rim so the near-black hide holds its shape */
scene.add(new THREE.HemisphereLight(0xd0d8ff, 0xc0905e, 2.9));
const sun = new THREE.DirectionalLight(0xffe0b8, 3.6); sun.position.set(-8, 10, 6); scene.add(sun);
const rim = new THREE.DirectionalLight(0xb8c8ff, 2.6); rim.position.set(6, 6, -8); scene.add(rim);
{ // an environment from a plain sky, so the model's own (PBR) materials read
  const pm = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 16, 8), new THREE.MeshBasicMaterial({ color: 0x9ac0e8, side: THREE.BackSide })));
  env.add(new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2).translate(0, -10, 0), new THREE.MeshBasicMaterial({ color: 0x6a7a40 })));
  scene.environment = pm.fromScene(env, 0.04).texture;
}
/* side on: the model faces +z, so look along +x to see it face right */
const cam = new THREE.OrthographicCamera(-W / 2 / PPM, W / 2 / PPM, H / 2 / PPM, -H / 2 / PPM, 0.1, 100);
cam.position.set(-30, 0, 0); cam.lookAt(0, 0, 0);

const v3 = new THREE.Vector3();
function project(p) { v3.copy(p).project(cam); return [(v3.x * 0.5 + 0.5) * W, (-v3.y * 0.5 + 0.5) * H]; }

/* the frame on a 2D canvas, cropped, with an ink outline round the silhouette */
function grab(points) {
  const src = renderer.domElement;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const pad = 6; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  /* the silhouette, inked, spread a little in every direction, then the picture on top */
  const sil = document.createElement('canvas'); sil.width = w; sil.height = h; const sg = sil.getContext('2d');
  sg.drawImage(src, x0, y0, w, h, 0, 0, w, h); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = INK; sg.fillRect(0, 0, w, h);
  const out = document.createElement('canvas'); out.width = w; out.height = h; const og = out.getContext('2d');
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; og.drawImage(sil, Math.cos(a) * OUTLINE, Math.sin(a) * OUTLINE); }
  og.drawImage(src, x0, y0, w, h, 0, 0, w, h);
  const pts = {}; for (const k in points) pts[k] = [+(points[k][0] - x0).toFixed(1), +(points[k][1] - y0).toFixed(1)];
  return { png: out.toDataURL('image/png'), w, h, ...pts };
}

/* where the rider goes, measured on the Lútut's drop-shaped head in collider radii (wr):
   the hips just behind the horns, the hands on the horns (the Eikar steer by them, and hold on by them) */
const SEAT = { fwd: 0.62, up: 0.97 };
const HORN = { fwd: 1.14, up: 1.1, side: 0.26 };
const LEAN = 0.42;          // tipped forward toward the horns
const DEBUG = /debug/.test(location.search);

async function run() {
  await loadLutut();
  const out = { ppm: PPM, yaw: YAW, lutut: {}, eikar: {} };
  const LA = buildLututActor({ variant: 'adult' }), L = LA.lutut;
  L.driven = true; LA.root.rotation.y = YAW; scene.add(LA.root);
  const E = buildEikar({ skin: '#a8743e', cap: '#5a3a1e', marking: 0xffd27a, markColor: 0x2a1208, tunic: 0x3e6a5a, trim: 0xc8a050, weapon: 'none', satchel: false, flasks: false, build: 1, capTall: 0.62, cape: 0xc8503a });
  scene.add(E.root); E.root.visible = false;
  const dots = DEBUG ? [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xff2020, depthTest: false })); m.renderOrder = 9; scene.add(m); return m; }) : [];
  const col = name => L.colliders().find(c => c.name === name) || L.colliders()[0];
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  /* the Eikar sat on it, this frame: hips on the head behind the horns, tipped forward, a hand on each horn */
  function seatRider(mid) {
    const f = L.mouth().clone().sub(mid.p).normalize();
    const side = V(1, 0, 0).applyQuaternion(LA.root.quaternion);
    const up = new THREE.Vector3().crossVectors(f, side).normalize(); if (up.y < 0) up.negate();
    const sd = new THREE.Vector3().crossVectors(up, f).normalize();          // the rider's own +x
    const basis = new THREE.Matrix4().makeBasis(sd, up, f);
    const q = new THREE.Quaternion().setFromRotationMatrix(basis).multiply(new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), LEAN));
    const seat = mid.p.clone().addScaledVector(f, mid.wr * SEAT.fwd).addScaledVector(up, mid.wr * SEAT.up);
    E.root.quaternion.copy(q);
    E.root.position.copy(seat).sub(V(0, 0.52, 0).applyQuaternion(q));       // the hips are 0.52 m above its feet, sat astride
    for (let i = 0; i < 30; i++) E.animate(0.03, { t: i * 0.03, speed: 0, onGround: true, ride: true, reins: true, rideSpeed: 3, rideBob: 0 });
    E.root.updateMatrixWorld(true);
    const horn = s => mid.p.clone().addScaledVector(f, mid.wr * HORN.fwd).addScaledVector(up, mid.wr * HORN.up).addScaledVector(sd, s * mid.wr * HORN.side);
    for (const a of E.arms) {
      const T = E.torso.worldToLocal(horn(a.s));
      poseArm(a, T, V(0, 1, 0.3).normalize(), V(a.s, 0, 0));
    }
    E.root.updateMatrixWorld(true);
    if (DEBUG) { dots[0].position.copy(horn(-1)); dots[1].position.copy(horn(1)); dots[2].position.copy(seat); }
    return seat;
  }
  const pose = (name, t) => {
    L.play(name, 0); LA.animate(1e-4, {});
    if (t > 0) { const steps = Math.ceil(t / 0.02); for (let i = 0; i < steps; i++) LA.animate(t / steps, {}); }
    LA.root.updateMatrixWorld(true); LA.animate(1e-4, {});
  };
  const shot = (name, t, rider) => {
    pose(name, t);
    const mid = col('col_body_mid');
    let seat = mid.p.clone().addScaledVector(V(0, 1, 0), mid.wr * 0.92);
    E.root.visible = !!rider;
    if (rider) seat = seatRider(mid);
    renderer.render(scene, cam);
    return grab({ body: project(mid.p), seat: project(seat), mouth: project(L.mouth()), tail: project(L.tail()) });
  };
  const dur = n => L.acts[n].getClip().duration;
  /* with its rider, and (for after the Eikar is thrown, or the end) a few on its own */
  const add = (key, name, t, alone) => { out.lutut[key + '_r'] = shot(name, t, true); if (alone) out.lutut[key] = shot(name, t, false); };
  for (let i = 0; i < 8; i++) add('fly' + i, 'Fly', dur('Fly') * i / 8, i === 0);
  add('glide', 'Glide', dur('Glide') * 0.5, true);
  add('dive', 'Dive', dur('Dive') * 0.45, true);
  for (let i = 0; i < 6; i++) add('walk' + i, 'Walk', dur('Walk') * i / 6, true);
  add('stand', 'Stand', dur('Stand') * 0.3, true);
  add('suck', 'Suck', dur('Suck') * 0.45, false);
  add('screech', 'Screech', dur('Screech') * 0.5, false);
  add('hurt', 'Hurt', dur('Hurt') * 0.4, false);
  out.lutut.death = shot('Death', dur('Death') * 0.999, false);
  scene.remove(LA.root); dots.forEach(d => scene.remove(d));

  /* the Eikar thrown, tumbling */
  E.root.visible = true; E.root.position.set(0, 0, 0); E.root.quaternion.setFromEuler(new THREE.Euler(0, YAW, 0));
  for (let i = 0; i < 40; i++) E.animate(0.03, { t: i * 0.03, speed: 0, onGround: false });
  E.root.updateMatrixWorld(true); renderer.render(scene, cam);
  out.eikar.fall = grab({ seat: project(V(0, 0, 0)) });
  window.__done = out;
}
run().catch(e => { window.__error = String(e && e.stack || e); });
</script>
</body>
</html>
